<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Interview Prep Lab — Allied Softech</title>
  <meta name="description" content="A futuristic interview preparation lab: 326 Technical, DSA, Loops and HR questions with progress tracking, streaks and smart search.">
  <meta name="theme-color" content="#04050d">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3CradialGradient id='g' cx='35%25' cy='30%25'%3E%3Cstop offset='0' stop-color='%23c4baff'/%3E%3Cstop offset='1' stop-color='%236a4dff'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='22' fill='url(%23g)'/%3E%3Cellipse cx='32' cy='32' rx='30' ry='9' fill='none' stroke='%2335d4f4' stroke-width='3' transform='rotate(-24 32 32)'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="tailwind.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="font-body antialiased">
  <a href="#view" class="skip-link" data-skip>Skip to content</a>

  <!-- cosmic background -->
  <canvas id="stars" aria-hidden="true"></canvas>
  <div class="nebula" aria-hidden="true"><i></i><i></i><i></i></div>
  <div class="grain" aria-hidden="true"></div>

  <!-- cursor effects (created only on fine-pointer devices) -->
  <div id="fx-layer" aria-hidden="true"></div>

  <div id="app">
    <div id="scrim" class="scrim" data-act="close-nav"></div>
    <aside id="sidebar" class="sidebar" aria-label="Primary"></aside>

    <header id="topbar" class="topbar">
      <button class="icon-btn" data-act="open-nav" aria-label="Open menu"><svg viewBox="0 0 24 24" class="ic"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
      <a href="#/dashboard" class="topbar-brand"><span class="brand-orb"></span><span class="font-display font-semibold tracking-tight">Prep Lab</span></a>
      <div class="flex-1"></div>
      <span id="topbar-streak" class="chip chip-fire" title="Current streak"></span>
      <button class="icon-btn" data-act="open-search" aria-label="Search questions"><svg viewBox="0 0 24 24" class="ic"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
    </header>

    <main id="view" tabindex="-1" aria-live="polite"></main>
  </div>

  <div id="toasts" aria-live="polite" aria-atomic="false"></div>
  <div id="modal-root"></div>
  <div id="palette-root"></div>
  <noscript><div style="position:fixed;inset:0;display:grid;place-items:center;background:#04050d;color:#e8eaff;font:16px sans-serif">Interview Prep Lab needs JavaScript enabled.</div></noscript>

  <!-- data (classic scripts so the site also works when opened from disk) -->
  <script src="data/technical.js"></script>
  <script src="data/dsa.js"></script>
  <script src="data/loops.js"></script>
  <script src="data/hr.js"></script>
  <!-- app modules -->
  <script src="js/store.js"></script>
  <script src="js/data.js"></script>
  <script src="js/markdown.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/guides.js"></script>
  <script src="js/views.js"></script>
  <script src="app.js"></script>
</body>
</html>
